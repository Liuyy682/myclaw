name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e . pytest
      - name: Run tests
        run: python -m pytest -q

  webui:
    name: WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix webui
      - name: Run tests
        run: npm --prefix webui test
      - name: Build
        run: npm --prefix webui run build
      - name: Check committed build output
        run: git diff --exit-code -- myclaw/web/dist

  release-artifacts:
    name: Release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build Python distributions
        run: |
          python -m pip install build
          python -m build
      - name: Verify wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/myclaw-wheel"
          "$RUNNER_TEMP/myclaw-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/myclaw-wheel/bin/python" -c "import myclaw; print(myclaw.__file__)"
      - name: Build Docker image
        run: docker build --tag myclaw:ci .
      - name: Start Docker container
        run: docker run --detach --name myclaw-ci --publish 127.0.0.1:8765:8765 myclaw:ci
      - name: Verify Docker container
        run: |
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              --output "$RUNNER_TEMP/myclaw-health.json" \
              http://127.0.0.1:8765/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Gateway did not become healthy within 30 seconds" >&2
            exit 1
          fi
          python -c "import json, os, pathlib; response = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'myclaw-health.json').read_text()); assert response == {'status': 'ok'}, response"
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8765/
      - name: Show Docker logs on failure
        if: failure()
        run: docker logs myclaw-ci || true
      - name: Remove Docker container
        if: always()
        run: docker rm --force myclaw-ci || true
