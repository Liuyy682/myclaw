version: 1
name: deterministic
description: >-
  Deterministic, fixture-backed checks for the current MyClaw runtime. Every
  case points at a collected pytest node and uses only relative fixture paths.
dataset: evals/datasets/live_core.jsonl
fixture:
  type: temporary_workspace
  path_policy: relative_only
  assertion_types:
    - field_equals
    - field_contains
    - count_equals
    - set_equals
    - file_exists
    - file_not_exists
category_counts:
  tool: 12
  repo_task: 16
  context: 8
  recovery: 8
  safety: 8
  coordination: 8
cases:
  - case_id: tool-001
    category: tool
    capability: tool_registry
    claim: definitions_are_sorted_and_cached
    metric_type: schema_stability
    pytest_node_id: "tests/tools/test_tools.py::test_registry_returns_cached_definitions_in_stable_name_order"
  - case_id: tool-002
